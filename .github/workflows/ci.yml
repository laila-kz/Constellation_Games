name: Constellation Games CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-java:
    name: Build & Verify Java Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java Constellation Drawer
        run: |
          mkdir -p bin
          javac -d bin constellation_java/src/constellation/*.java

  build-node:
    name: Build & Verify MediaPipe Module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: constellation_mediaPipe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: constellation_mediaPipe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
